rules:
  # ============================================================
  # Activity / Browsing
  # ============================================================
  - id: chrome-history
    message: "Uses chrome.history API"
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      category: activity
      api: chrome.history
    pattern: chrome.history.$METHOD(...)

  - id: chrome-webnavigation
    message: "Uses chrome.webNavigation API"
    languages: [javascript, typescript]
